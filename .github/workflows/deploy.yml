name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Add safe directory
        run: git config --global --add safe.directory /home/nihcas/server/portfolio

      - name: Update code on server
        run: |
          cd /home/nihcas/server/portfolio
          git fetch origin main
          git reset --hard origin/main
          git clean -fd

      - name: Install dependencies
        run: |
          cd /home/nihcas/server/portfolio
          pnpm install

      - name: Build
        run: |
          cd /home/nihcas/server/portfolio
          pnpm run build

      - name: Restart PM2 using ecosystem
        run: |
          export PATH=$PATH:/home/nihcas/.local/share/pnpm:/usr/local/bin
          cd /home/nihcas/server

          # This will start OR restart the app
          pm2 start ecosystem.config.js --only portfolio --update-env

          # Save the process list
          pm2 save
